<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>الخرائط - 🌟用钱买快乐🌟</title>

    <link rel="stylesheet" href="maps.css">
</head>

<body>

    <header>
        <h1>🗺️ الخرائط</h1>
    </header>

    <main class="maps-container">

        <button class="map-room" data-map="guess">
            <span>🎨</span>
            <strong>احزر إيش برسم</strong>
        </button>

        <button class="map-room" data-map="continue">
            <span>✏️</span>
            <strong>كمّل على رسمتي</strong>
        </button>

        <button class="map-room" data-map="lonely">
            <span>🧑‍🎨</span>
            <strong>فنان متوحد</strong>
        </button>

        <button class="map-room" data-map="tea">
            <span>🍵</span>
            <strong>مجتمعين على الشاي</strong>
        </button>

        <button class="map-room" data-map="teacher">
            <span>📚</span>
            <strong>أنا المعلم</strong>
        </button>

        <button class="map-room" data-map="museum">
            <span>🏛️</span>
            <strong>متحف فني</strong>
        </button>

    </main>

    <script src="../functions.js"></script>
    <script src="maps.js"></script>

</body>
</html>
