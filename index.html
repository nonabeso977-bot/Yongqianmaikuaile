<!DOCTYPE html>
<html lang="ar">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>🌟用钱买快乐🌟</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <main class="home">


        <!-- العنوان -->

        <header class="main-title">
            🌟用钱买快乐🌟
        </header>


        <!-- المابات الرئيسية -->

        <section class="rooms">


            <!-- قروب رسم -->

            <a
                class="room"
                href="chat/chat.html"
            >

                <span class="room-icon">
                    👥
                </span>

                <strong>
                    قروب رسم
                </strong>

            </a>


            <!-- رسم فردي -->

            <a
                class="room"
                href="drawing/drawing.html"
            >

                <span class="room-icon">
                    🎨
                </span>

                <strong>
                    رسم فردي
                </strong>

            </a>


            <!-- احزر -->

            <a
                class="room"
                href="maps/maps.html"
            >

                <span class="room-icon">
                    🗺️
                </span>

                <strong>
                    احزر
                </strong>

            </a>


            <!-- فصل -->

            <a
                class="room"
                href="museum/museum.html"
            >

                <span class="room-icon">
                    🏫
                </span>

                <strong>
                    فصل
                </strong>

            </a>


        </section>


        <!-- الشريط السفلي -->

        <nav class="bottom-nav">


            <button
                type="button"
                data-nav="settings"
                aria-label="الإعدادات"
            >
                ⚙️
            </button>


            <button
                type="button"
                data-nav="publish"
                aria-label="النشر"
            >
                ➕
            </button>


            <button
                type="button"
                data-nav="profile"
                aria-label="الحساب"
            >
                👤
            </button>


        </nav>


    </main>


    <script src="functions.js"></script>

    <script src="themes.js"></script>

    <script src="app.js"></script>


</body>

</html>
