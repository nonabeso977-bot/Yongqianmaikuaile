<!DOCTYPE html>
<html lang="ar">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>🌟用钱买快乐🌟</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <main class="home">


        <!-- العنوان -->

        <header class="main-title">
            🌟用钱买快乐🌟
        </header>



        <!-- الغرف الرئيسية -->

        <section class="rooms">


            <button
                class="room"
                data-room="chat/chat.html"
                type="button"
            >

                <span class="room-icon">
                    👥
                </span>

                <strong>
                    قروب رسم
                </strong>

            </button>



            <button
                class="room"
                data-room="drawing/drawing.html"
                type="button"
            >

                <span class="room-icon">
                    🎨
                </span>

                <strong>
                    رسم فردي
                </strong>

            </button>



            <button
                class="room"
                data-room="maps/maps.html"
                type="button"
            >

                <span class="room-icon">
                    🗺️
                </span>

                <strong>
                    احزر
                </strong>

            </button>



            <button
                class="room"
                data-room="museum/museum.html"
                type="button"
            >

                <span class="room-icon">
                    🏛️
                </span>

                <strong>
                    فصل
                </strong>

            </button>


        </section>



        <!-- الشريط السفلي -->

        <nav class="bottom-nav">


            <button
                type="button"
                data-nav="settings"
                aria-label="الإعدادات"
            >
                ⚙️
            </button>


            <button
                type="button"
                data-nav="publish"
                aria-label="النشر"
            >
                ➕
            </button>


            <button
                type="button"
                data-nav="profile"
                aria-label="الحساب"
            >
                👤
            </button>


        </nav>


    </main>



    <script src="functions.js"></script>
    <script src="app.js"></script>


</body>

</html>
