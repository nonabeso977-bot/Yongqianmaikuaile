<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>المتحف الفني - 🌟用钱买快乐🌟</title>

    <link rel="stylesheet" href="museum.css">
</head>

<body>

    <header>
        <h1>🏛️ المتحف الفني</h1>
        <p>تجوّل بين الأعمال الفنية واكتشف الرسومات.</p>
    </header>

    <main class="museum">

        <section class="museum-room">
            <h2>قاعة البداية</h2>

            <div class="art-wall">

                <button class="artwork" data-art="1">
                    🎨
                    <span>عمل فني 1</span>
                </button>

                <button class="artwork" data-art="2">
                    🖼️
                    <span>عمل فني 2</span>
                </button>

                <button class="artwork" data-art="3">
                    🌟
                    <span>عمل فني 3</span>
                </button>

            </div>
        </section>

        <section class="museum-room">
            <h2>قاعة المجتمع</h2>

            <div class="art-wall">

                <button class="artwork" data-art="4">
                    🐱
                    <span>عمل فني 4</span>
                </button>

                <button class="artwork" data-art="5">
                    🌸
                    <span>عمل فني 5</span>
                </button>

                <button class="artwork" data-art="6">
                    🌙
                    <span>عمل فني 6</span>
                </button>

            </div>
        </section>

    </main>

    <script src="../functions.js"></script>
    <script src="museum.js"></script>

</body>
                  </html>
