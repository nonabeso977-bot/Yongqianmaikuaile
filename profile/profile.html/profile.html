<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>حسابي - 🌟用钱买快乐🌟</title>

    <link rel="stylesheet" href="profile.css">
</head>

<body>

    <header class="profile-header">

        <div class="avatar">
            👤
        </div>

        <div class="profile-info">
            <h1 id="username">فنان جديد</h1>
            <p id="bio">مرحبًا في عالمي الفني 🎨</p>
        </div>

    </header>


    <main class="profile-content">

        <section class="badges-section">

            <h2>🏅 شاراتي</h2>

            <div class="badges">

                <div class="badge">
                    <span>🎨</span>
                    <strong>فنان</strong>
                    <small>10 نجوم</small>
                </div>

                <div class="badge">
                    <span>🌟</span>
                    <strong>فان كوخ</strong>
                    <small>20 نجمة</small>
                </div>

                <div class="badge locked">
                    <span>🔒</span>
                    <strong>الشارة الثالثة</strong>
                    <small>مقفلة</small>
                </div>

                <div class="badge locked">
                    <span>🔒</span>
                    <strong>الشارة الرابعة</strong>
                    <small>مقفلة</small>
                </div>

            </div>

        </section>


        <section class="gallery-section">

            <h2>🎨 رسوماتي</h2>

            <div id="gallery" class="gallery">

                <div class="empty-gallery">
                    لا توجد رسومات بعد.
                </div>

            </div>

        </section>

    </main>


    <script src="../functions.js"></script>
    <script src="profile.js"></script>

</body>
</html>
