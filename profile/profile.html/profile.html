<!DOCTYPE html>
<html lang="ar">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>حسابي - 🌟用钱买快乐🌟</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >

    <link
        rel="stylesheet"
        href="profile.css"
    >

</head>


<body>


    <header class="profile-header">

        <div class="avatar">
            👤
        </div>


        <div class="profile-info">

            <h1 id="username">
                فنان جديد
            </h1>

            <p id="bio">
                مرحبًا في عالمي الفني 🎨
            </p>

        </div>

    </header>



    <main class="profile-content">


        <section class="stats-section">

            <div class="stat">

                <strong id="starsCount">
                    0
                </strong>

                <span>
                    ⭐ النجوم
                </span>

            </div>


            <div class="stat">

                <strong id="drawingsCount">
                    0
                </strong>

                <span>
                    🎨 الرسومات
                </span>

            </div>


            <div class="stat">

                <strong id="badgesCount">
                    0
                </strong>

                <span>
                    🏅 الأوسمة
                </span>

            </div>

        </section>



        <section class="badges-section">

            <h2>
                🏅 أوسمتي
            </h2>


            <div
                id="badges"
                class="badges"
            >

            </div>

        </section>



        <section class="gallery-section">

            <h2>
                🎨 رسوماتي
            </h2>


            <div
                id="gallery"
                class="gallery"
            >

                <div class="empty-gallery">
                    لا توجد رسومات بعد.
                </div>

            </div>

        </section>


    </main>



    <script src="../functions.js"></script>

    <script src="../themes.js"></script>

    <script src="../badges.js"></script>

    <script src="profile.js"></script>


</body>

</html>
