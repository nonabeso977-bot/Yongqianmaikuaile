<!DOCTYPE html>
<html lang="ar">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>الشات - 🌟用钱买快乐🌟</title>

    <link
        rel="stylesheet"
        href="chat.css"
    >

</head>


<body>


    <main class="chat-page">


        <!-- رأس الشات -->

        <header class="chat-header">

            <h1>
                💬 الشات
            </h1>

        </header>


        <!-- الرسائل -->

        <section
            id="messages"
            class="messages"
        >

            <div class="message other">

                <span class="message-name">
                    فنان
                </span>

                <p>
                    مرحبًا 🎨
                </p>

            </div>

        </section>


        <!-- كتابة الرسالة -->

        <form
            id="chatForm"
            class="chat-input"
        >

            <input
                id="messageInput"
                type="text"
                placeholder="اكتب رسالة..."
                autocomplete="off"
            >

            <button type="submit">
                إرسال
            </button>

        </form>


    </main>


    <script src="../functions.js"></script>

    <script src="chat.js"></script>


</body>

</html>
