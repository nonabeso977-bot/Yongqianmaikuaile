<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>الدردشة - 🌟用钱买快乐🌟</title>

    <link rel="stylesheet" href="chat.css">
</head>

<body>

    <header class="chat-header">
        <h1>💬 الدردشة</h1>
    </header>


    <main class="chat-container">

        <section id="messages" class="messages">

            <div class="message other">
                <span class="message-name">فنان</span>
                <p>مرحبًا 🎨</p>
            </div>

        </section>


        <section class="chat-tools">

            <button id="drawButton" type="button">
                🎨 رسم
            </button>

            <button id="clearDrawing" type="button">
                🗑️ مسح الرسم
            </button>

        </section>


        <section class="drawing-area">

            <canvas id="chatCanvas"></canvas>

        </section>


        <form id="chatForm" class="chat-input">

            <input
                id="messageInput"
                type="text"
                placeholder="اكتب رسالة..."
                autocomplete="off"
            >

            <button type="submit">
                إرسال
            </button>

        </form>

    </main>


    <script src="../functions.js"></script>
    <script src="chat.js"></script>

</body>
</html>
